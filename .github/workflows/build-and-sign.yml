name: Build and Sign

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Job-level env so secrets are available in step `if:` conditions.
      # The `secrets` context itself is NOT allowed in `if:`.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile `
            app.py gui.py collectors.py sysdigger.pyw tools.py `
            sensors.py helpers.py config.py lhm_process.py `
            updater.py app_logger.py paths.py

      - name: Build with PyInstaller
        run: pyinstaller sysdigger.spec --noconfirm --clean

      - name: Zip the build
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "dev" }
          Compress-Archive -Path dist\SysDigger\* -DestinationPath "SysDigger-$tag.zip"

      - name: Submit to SignPath for signing
        id: signpath
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORG_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: SysDigger
          signing-policy-slug: release-signing
          artifact-configuration-slug: release-config
          github-artifact-id: ${{ github.event.release.tag_name }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed zip to release
        if: steps.signpath.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: signed/SysDigger-*.zip

      - name: Upload unsigned zip to release
        if: steps.signpath.outcome != 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: SysDigger-*.zip
